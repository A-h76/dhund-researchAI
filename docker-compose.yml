services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dhund
      POSTGRES_PASSWORD: dhund
      POSTGRES_DB: dhund
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dhund -d dhund']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ['--role=api']
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://dhund:dhund@postgres:5432/dhund
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ['--role=worker']
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://dhund:dhund@postgres:5432/dhund
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
