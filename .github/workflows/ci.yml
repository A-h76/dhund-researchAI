name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate-load-bearing:
    name: gate-load-bearing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: §11a.2a test 1 — provider SDK import
        run: npm run test:load-bearing -- --testNamePattern="11a\\.2a test 1"
      - name: §11a.2a test 4 — ai_executions row
        if: always()
        run: npm run test:load-bearing -- --testNamePattern="11a\\.2a test 4"
      - name: Record gate result
        if: always()
        run: |
          {
            echo "### gate-load-bearing"
            echo "status=${{ job.status }}"
            echo "sha=${{ github.sha }}"
            echo "Tests 1 and 4 of section 11a.2a. A failure blocks the architecture boundary suite."
          } >> "$GITHUB_STEP_SUMMARY"

  gate-architecture:
    name: gate-architecture
    needs: gate-load-bearing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Architecture boundary suite
        run: npm run test:architecture
      - name: Record gate result
        if: always()
        run: |
          {
            echo "### gate-architecture"
            echo "status=${{ job.status }}"
            echo "sha=${{ github.sha }}"
            echo "Single-owner, gateway isolation tests 2–3, import direction, guard coverage, schema, vocabulary, fixture lint."
          } >> "$GITHUB_STEP_SUMMARY"

  gate-migration:
    name: gate-migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migration order 001–020
        run: npm run test:migration-order
      - name: Apply migrations on disposable Postgres
        run: |
          docker network create dhund-migrate-gate || true
          docker run -d --name dhund-postgres-migrate-gate --network dhund-migrate-gate \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=dhund \
            -p 5433:5432 \
            pgvector/pgvector:pg16
          ready=0
          for i in $(seq 1 30); do
            if docker exec dhund-postgres-migrate-gate pg_isready -U postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Disposable Postgres did not become ready"
            exit 1
          fi
          echo "First migrate deploy:"
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/dhund npx prisma migrate deploy
          echo "Second migrate deploy (must be no-op):"
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/dhund npx prisma migrate deploy
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/dhund npx prisma migrate status
      - name: Remove disposable Postgres
        if: always()
        run: |
          docker rm -f dhund-postgres-migrate-gate || true
          docker network rm dhund-migrate-gate || true
      - name: Record gate result
        if: always()
        run: |
          {
            echo "### gate-migration"
            echo "status=${{ job.status }}"
            echo "sha=${{ github.sha }}"
            echo "Out-of-order or failing migrations 001–020 block the deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  gate-idor:
    name: gate-idor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cross-tenant IDOR matrix
        run: npm run test:idor-gate
      - name: Record gate result
        if: always()
        run: |
          {
            echo "### gate-idor"
            echo "status=${{ job.status }}"
            echo "sha=${{ github.sha }}"
            echo "A cross-tenant 200 or 403-with-data blocks the deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and static tests
        run: npm run test:ci

      - name: L0 integration tests (Testcontainers)
        run: npm run test:integration

      - name: Build Docker image
        run: docker build -t dhund-research-ai:ci .

      - name: Worker smoke — no listening TCP port
        run: |
          docker network create dhund-smoke || true
          docker run -d --name dhund-redis-smoke --network dhund-smoke redis:7-alpine
          sleep 2
          docker run -d --name dhund-worker-smoke --network dhund-smoke \
            -e REDIS_URL=redis://dhund-redis-smoke:6379 \
            dhund-research-ai:ci --role=worker
          sleep 3
          PID=$(docker inspect -f '{{.State.Pid}}' dhund-worker-smoke)
          LISTENERS=$(sudo ss -ltnp | grep "pid=${PID}," || true)
          if [ -n "$LISTENERS" ]; then
            echo "Worker has listening TCP sockets:"
            echo "$LISTENERS"
            exit 1
          fi
          docker rm -f dhund-worker-smoke dhund-redis-smoke
          docker network rm dhund-smoke || true

      - name: API smoke — HTTP listener
        run: |
          docker network create dhund-api-smoke || true
          docker run -d --name dhund-postgres-api-smoke --network dhund-api-smoke \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=dhund \
            -p 5432:5432 \
            pgvector/pgvector:pg16
          docker run -d --name dhund-redis-api-smoke --network dhund-api-smoke redis:7-alpine
          for i in $(seq 1 30); do
            if docker exec dhund-postgres-api-smoke pg_isready -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/dhund npx prisma migrate deploy
          docker run -d --name dhund-api-smoke --network dhund-api-smoke -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:postgres@dhund-postgres-api-smoke:5432/dhund \
            -e REDIS_URL=redis://dhund-redis-api-smoke:6379 \
            dhund-research-ai:ci --role=api
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "API smoke failed; container status and logs:"
            docker ps -a --filter name=dhund-api-smoke
            docker logs dhund-api-smoke || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:3000/health
          docker rm -f dhund-api-smoke dhund-redis-api-smoke dhund-postgres-api-smoke
          docker network rm dhund-api-smoke || true
